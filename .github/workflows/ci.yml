name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The suite is local and deterministic; no model credentials are needed.
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
